<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Goal Planner · Bajaj Broking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="web.css" />
</head>
<body>
  <!-- ================= header (unchanged product chrome) ================= -->
  <header class="hdr">
    <div class="top">
      <a class="logo" href="#" aria-label="Bajaj Broking home">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 18"><path d="M5 2h8.2c2.6 0 4.3 1.3 4.3 3.4 0 1.4-.8 2.4-2 2.9 1.6.4 2.6 1.6 2.6 3.2 0 2.4-1.9 3.9-4.8 3.9H5V2zm3.4 2.7v3h4.1c1 0 1.6-.6 1.6-1.5s-.6-1.5-1.6-1.5H8.4zm0 5.5v3.1h4.5c1.1 0 1.8-.6 1.8-1.6s-.7-1.5-1.8-1.5H8.4z" fill="#0B2C59"/></svg>
          <em>BAJAJ</em>
        </span>
        <span class="logo-word">BROKING</span>
      </a>
      <div class="tick"><span class="n">SENSEX</span><span><b class="down">80,372.42</b><small>-129.66 (-0.16%)</small></span></div>
      <div class="tick"><span class="n">NIFTY</span><span><b class="up">17,567.46</b><small>+905.34(+1.34%)</small></span></div>
      <div class="tick last"><span class="n">BANK NIFTY</span><span><b class="down">52,206.40</b><small>-74.00 (-0.14%)</small></span></div>
      <button class="tick-more" aria-label="More indices"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
      <nav class="topnav" aria-label="Primary">
        <a href="#">Stocks</a><a href="#">F&amp;O</a><a href="#" class="on" aria-current="page">Mutual Funds</a>
      </nav>
      <button class="bell" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1112 0v5l1.5 2h-15L6 16z"/><path d="M10 20.5a2 2 0 004 0"/></svg><i></i></button>
      <span class="avatar" aria-label="Profile">LG</span>
    </div>
    <nav class="subnav" aria-label="Secondary">
      <a href="#" class="on">Home</a><a href="#">Portfolio</a><a href="#">SIPs</a><a href="#">Orders</a>
    </nav>
  </header>

  <div class="page">
    <!-- ================= watchlist (unchanged) ================= -->
    <aside class="side" aria-label="Watchlist">
      <div class="search">
        <label><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input placeholder="Search Stock, F&amp;O, ETF....." aria-label="Search" /></label>
        <button class="filter" aria-label="Filters"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/><path d="M4 12h2M10 12h10"/><circle cx="8" cy="12" r="2"/></svg></button>
      </div>
      <div class="wl-head"><span>Watchlist</span><button aria-label="Edit watchlist"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button></div>
      <div class="wl-cols"><span>Fund Name</span><span>3Y Returns <b>&lt; &gt;</b></span></div>
      <ul class="wl" id="wl"></ul>
    </aside>

    <!-- ================= goal planner (redesigned) ================= -->
    <main class="main" id="main">
      <section class="banner mesh" id="banner" aria-label="Choose a goal"></section>
      <div class="grid">
        <div class="col">
          <section class="card plan" id="plan" aria-label="Your plan"></section>
          <section class="card miles" id="miles" aria-label="Milestones"></section>
        </div>
        <section class="card result" id="result" aria-label="Your investment plan"></section>
      </div>
      <section class="card funds" id="funds" aria-label="Choose your mutual funds"></section>
      <section class="card checkout" id="checkout" aria-label="Allocation and invest"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="web.js"></script>
</body>
</html>
